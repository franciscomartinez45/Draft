name: Refresh ADP

# ADP moves every day, and a stale board fails INVISIBLY -- the app looks like it
# is working while handing out confidently wrong advice. This does the morning-of
# ritual on a schedule so it does not depend on anyone being at a laptop.
#
# ---------------------------------------------------------------------------
# HEADS UP, FUTURE SEASON: GitHub disables scheduled workflows after 60 days of
# repository inactivity. This repo goes quiet outside draft season, so before
# next August open the Actions tab and confirm "Refresh ADP" is still enabled.
# Pushing any commit re-arms it.
# ---------------------------------------------------------------------------

on:
  schedule:
    # GitHub cron is always UTC and has no daylight-saving handling, so this is
    # pinned to Pacific DAYLIGHT time -- which is what draft season runs on.
    # 13:00 UTC = 06:00 PDT (Mar-Nov, incl. every draft) = 09:00 EDT.
    # It drifts to 05:00 PST in winter, which does not matter for a draft tool.
    - cron: '0 13 * * *'
  workflow_dispatch:         # and on demand, from the Actions tab

permissions:
  contents: write            # needed to push the rebuilt index.html back to main

concurrency:
  group: refresh-adp
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Every step below is deliberately fail-fast. fetch-adp.mjs writes
      # adp-data.json BEFORE exiting non-zero on a partial failure, so a failed
      # fetch leaves a half-written file in the workspace. Nothing may be
      # committed unless the fetch, the build, AND the tests all pass.
      # Do not add `if: always()` or `continue-on-error` to any of these.
      - name: Fetch ADP
        run: node fetch-adp.mjs

      # Projected points are what the board ranks on; ADP only decides who is
      # still available. This fails if under 95% of the board joins, rather than
      # publishing a board where most players look worthless.
      - name: Fetch projections
        run: node fetch-projections.mjs

      - name: Rebuild index.html
        run: node build.mjs

      # build.mjs validates the data (4 formats, player floors, CSP, no missing
      # board column). These catch the other half: a page that renders empty.
      - name: Test
        run: |
          node --test engine.test.mjs
          node smoke.mjs

      - name: Publish if the board changed
        run: |
          # adp-data.json carries a fetchedAt timestamp, so a successful refresh
          # normally always differs. The guard is for the pathological no-op.
          if git diff --quiet -- adp-data.json projections.json index.html; then
            echo "Board unchanged - nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adp-data.json projections.json index.html
          git commit -m "refresh ADP ($(date -u +%Y-%m-%d))"
          git push
          echo "Published. GitHub Pages redeploys shortly."
